name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exelix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exelix-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exelix-unsigned-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
