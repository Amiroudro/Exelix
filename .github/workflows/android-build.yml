name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release-signing configuration (optional)
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EXELIX_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EXELIX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXELIX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EXELIX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$STORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing is not configured; release artifacts will be unsigned."
            exit 0
          fi
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("EXELIX_RELEASE_KEYSTORE_BASE64")
          [ -n "$STORE_PASSWORD" ] || missing+=("EXELIX_RELEASE_STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("EXELIX_RELEASE_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("EXELIX_RELEASE_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Incomplete release-signing secrets: ${missing[*]}"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/exelix-release-key.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::Keystore secret is not valid Base64."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore, store password, or key alias validation failed."
            exit 1
          fi
          echo "EXELIX_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build and test Android variants
        run: gradle testDebugUnitTest assembleDebug assembleRelease bundleRelease --no-parallel --max-workers=1
        env:
          EXELIX_RELEASE_STORE_FILE: ${{ env.EXELIX_RELEASE_STORE_FILE }}
          EXELIX_RELEASE_STORE_PASSWORD: ${{ secrets.EXELIX_RELEASE_STORE_PASSWORD }}
          EXELIX_RELEASE_KEY_ALIAS: ${{ secrets.EXELIX_RELEASE_KEY_ALIAS }}
          EXELIX_RELEASE_KEY_PASSWORD: ${{ secrets.EXELIX_RELEASE_KEY_PASSWORD }}
      - name: Verify signed release APK and bundle (when signing is configured)
        if: steps.release-signing.outputs.configured == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exelix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exelix-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exelix-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
